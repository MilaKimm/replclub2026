<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPL CLUB · 질문 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="qa">

<div id="sidebar-slot"></div>

<main>

  <div class="content">

    <div class="section-head">
      <div>
        <div class="eyebrow"><span class="pip"></span> Q&amp;A BOARD</div>
        <h2>운영팀에게 물어보세요</h2>
      </div>
    </div>

    <p style="font-size:15px; color:rgba(14,14,14,0.7); line-height:1.6; margin-bottom:32px; max-width:680px;">
      Wi-Fi, 케이터링, 발표 일정, 디버깅 도움까지 — 무엇이든 편하게 물어보세요.
      운영팀이 단계별로 답변해드립니다.
    </p>

    <!-- 새 질문 등록 -->
    <form class="qa-form" id="qaForm">
      <input class="input" id="qaName" placeholder="이름" maxlength="20" required>
      <input class="input" id="qaBody" placeholder="질문을 입력하고 Enter 또는 등록 버튼을 눌러주세요" maxlength="280" required>
      <button class="btn btn-primary" type="submit">등록</button>
    </form>

    <!-- 필터 -->
    <div class="qa-filter">
      <button class="qa-filter-btn active" data-filter="all">전체</button>
      <button class="qa-filter-btn" data-filter="pending">미답변만</button>
      <button class="qa-filter-btn" data-filter="done">답변 완료</button>
      <span style="margin-left:auto; align-self:center; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gray); font-weight:700; letter-spacing:0.16em;">
        총 <b id="qaTotal" style="color:var(--orange);">-</b> ·
        미답변 <b id="qaPending" style="color:var(--orange);">-</b>
      </span>
    </div>

    <!-- 질문 리스트 -->
    <div class="qa-list" id="qaList"></div>

    <footer>
      <div>REPL CLUB</div>
      <div>(주)마켓핏랩 <span class="dot">●</span> © 2026 MarketFitLab Inc. All rights reserved.</div>
    </footer>

  </div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function() {
  const STORE_KEY = 'rc_qa_2026';
  let currentFilter = 'all';

  function loadQA() {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) { try { return JSON.parse(saved); } catch(e) {} }
    localStorage.setItem(STORE_KEY, JSON.stringify(RC_DATA.qa));
    return RC_DATA.qa;
  }
  function saveQA(arr) { localStorage.setItem(STORE_KEY, JSON.stringify(arr)); }

  function escape(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  function qaItem(q) {
    return `<div class="qa-item">
      <div class="qa-q-head">
        <span class="qa-author">${escape(q.author)}</span>
        <span class="qa-time">${escape(q.time)}</span>
        <span class="qa-status-pill ${q.reply ? 'done' : 'pending'}">
          ${q.reply ? '🟢 답변 완료' : '🟡 답변 대기'}
        </span>
      </div>
      <div class="qa-q-body">${escape(q.body)}</div>
      ${q.reply ? `
        <div class="qa-reply">
          <div class="qa-reply-head">
            <span class="qa-reply-author">REPL CLUB 운영팀</span>
            <span class="qa-time">${escape(q.reply.time)}</span>
          </div>
          <div class="qa-reply-body">${escape(q.reply.body)}</div>
        </div>
      ` : ''}
    </div>`;
  }

  function render() {
    const all = loadQA();
    // 정렬: 최신순 (time 역순)
    const sorted = [...all].sort((a, b) => (b.time || '').localeCompare(a.time || ''));
    const filtered = sorted.filter(q => {
      if (currentFilter === 'pending') return !q.reply;
      if (currentFilter === 'done') return !!q.reply;
      return true;
    });
    document.getElementById('qaList').innerHTML = filtered.length
      ? filtered.map(qaItem).join('')
      : '<div style="text-align:center; padding:60px 20px; color:var(--gray); font-size:14px;">조건에 맞는 질문이 없어요.</div>';

    document.getElementById('qaTotal').textContent = all.length;
    document.getElementById('qaPending').textContent = all.filter(q => !q.reply).length;
  }

  // 새 질문 등록
  document.getElementById('qaForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('qaName').value.trim();
    const body = document.getElementById('qaBody').value.trim();
    if (!name || !body) return;
    const all = loadQA();
    const now = new Date();
    all.push({
      id: 'q' + Date.now(),
      author: name,
      time: `${window.RC.pad(now.getHours())}:${window.RC.pad(now.getMinutes())}`,
      body,
      reply: null,
    });
    saveQA(all);
    document.getElementById('qaBody').value = '';
    render();
  });

  // 필터
  document.querySelectorAll('.qa-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.qa-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  render();
  setInterval(render, 5000);
})();
</script>

</body>
</html>
