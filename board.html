<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPL CLUB · 레플 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="board">

<div id="sidebar-slot"></div>

<main>

  <div class="content">

    <div class="section-head" style="margin-bottom:16px;">
      <div>
        <div class="eyebrow"><span class="pip"></span> REPL BOARD</div>
        <h2>REPL TIME!</h2>
      </div>
    </div>
    <p style="font-size:15px; color:rgba(14,14,14,0.7); line-height:1.6; margin-bottom:32px; max-width:720px;">
      나의 프로젝트를 등록하고, 다른 팀의 빌드도 둘러보세요. 다같이 뚱땅뚱땅 레플 타임!
    </p>

    <div class="board-stats">
      <div class="board-stat">
        <div class="board-stat-label">총 등록</div>
        <div class="board-stat-value"><span id="projectCount">-</span><span class="unit">팀</span></div>
      </div>
      <div class="board-stat urgent">
        <div class="board-stat-label">최종 제출 마감까지</div>
        <div class="board-stat-value"><span id="boardCountdown">-</span></div>
      </div>
    </div>

    <!-- 시상 영역 (어드민이 단계별 공개 시 노출) -->
    <section class="awards" id="awardsSection" style="display:none;"></section>

    <!-- 전체 프로젝트 -->
    <section>
      <div class="section-head" style="margin-bottom:20px;">
        <div>
          <div class="eyebrow" style="margin-bottom:10px;"><span class="pip"></span> ALL PROJECTS</div>
          <h2 style="font-size:30px;">전체 프로젝트 모아보기</h2>
        </div>
        <button class="btn btn-primary btn-register" id="newProjectBtn">＋ 프로젝트 등록</button>
      </div>
      <div class="project-grid" id="projectGrid"></div>
    </section>

    <footer>
      <div>REPL CLUB</div>
      <div>(주)마켓핏랩 <span class="dot">●</span> © 2026 MarketFitLab Inc. All rights reserved.</div>
    </footer>

  </div>
</main>

<!-- ============ 등록 모달 ============ -->
<div class="modal-overlay" id="newProjectModal">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title">프로젝트 등록</div>
        <div class="modal-sub">REGISTER NEW PROJECT</div>
      </div>
      <button class="modal-close" data-close>✕</button>
    </div>
    <form id="newProjectForm" class="modal-body">
      <div class="field">
        <label class="field-label">팀명</label>
        <input class="input" name="team" required maxlength="30">
      </div>

      <div class="field">
        <label class="field-label">팀원 (최대 2명)</label>
        <div class="field-row">
          <input class="input" name="member1Name" placeholder="이름" required>
          <input class="input" name="member2Name" placeholder="이름 (선택)">
        </div>
        <div class="field-help note">ℹ︎ 입장 비표에 적힌 이름과 동일하게 적어주세요. (2인 팀은 두 분 모두 적어주세요)</div>
      </div>

      <div class="field">
        <label class="field-label">수정용 비밀번호</label>
        <input class="input" name="password" type="password" required minlength="2">
        <div class="field-help">프로젝트 수정·삭제 시 입력. 분실 시 운영팀에 문의.</div>
      </div>

      <div class="field">
        <label class="field-label">프로젝트 URL <span style="color:var(--gray); font-weight:500;">(선택)</span></label>
        <input class="input" name="url" type="url" placeholder="https://  · 등록 시 비워두고 나중에 추가해도 됩니다">
      </div>

      <div class="field">
        <label class="field-label">한줄 소개</label>
        <input class="input" name="tagline" required maxlength="80" placeholder="카드 미리보기에 노출됩니다">
      </div>

      <div class="field-divider" data-label="ABOUT YOUR PROJECT"></div>

      <div class="field">
        <label class="field-label">1. 무슨 문제를 해결하려고 하나요?</label>
        <textarea class="textarea" name="problem" required></textarea>
      </div>
      <div class="field">
        <label class="field-label">2. 누구를 위한 서비스인가요?</label>
        <textarea class="textarea" name="target" required></textarea>
      </div>
      <div class="field">
        <label class="field-label">3. 기존 방식보다 어떤 점이 나아지나요?</label>
        <textarea class="textarea" name="better" required></textarea>
      </div>
      <div class="field">
        <label class="field-label">4. 오늘 반드시 구현할 핵심 기능은?</label>
        <textarea class="textarea" name="mvp" required></textarea>
      </div>
      <div class="field">
        <label class="field-label">5. 현재 실제로 동작하는 부분은?</label>
        <textarea class="textarea" name="progress" required></textarea>
      </div>
    </form>
    <div class="modal-foot">
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" id="submitNewProject">등록하기</button>
    </div>
  </div>
</div>

<!-- ============ 상세 모달 ============ -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" id="detailModalInner">
    <!-- 동적 렌더 -->
  </div>
</div>

<script src="rc-sync.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function() {
  const STORE_KEY = 'rc_projects_2026';
  const AWARD_KEY = 'rc_award_phase';
  const COMMENTS_KEY = 'rc_comments_2026';

  // 시상 매핑은 어드민에서 개별 프로젝트마다 직접 지정
  const DEMO_AWARDS = {};

  function loadProjects() {
    const v = RCSync.get(STORE_KEY);
    if (Array.isArray(v)) return v;
    // 첫 진입 — 로컬 시드. rc-sync.js의 404 분기가 이걸 서버로 PUT 함.
    const init = RC_DATA.projects.map(p => ({ ...p, award: DEMO_AWARDS[p.id] || null }));
    RCSync.put(STORE_KEY, init);
    return init;
  }
  function saveProjects(p) { RCSync.put(STORE_KEY, p); }
  function getPhase() {
    const v = RCSync.get(AWARD_KEY);
    return (typeof v === 'string' && v) ? v : 'hidden';
  }

  function loadComments() {
    const v = RCSync.get(COMMENTS_KEY);
    return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  }
  function saveComments(c) { RCSync.put(COMMENTS_KEY, c); }

  // 시상 뱃지 (phase에 따라 노출 여부 결정)
  // phase 진행 순서: hidden → passed → special → bronze → silver → gold
  function getBadge(award, phase) {
    if (!award || phase === 'hidden') return null;
    const order = ['hidden','passed','special','bronze','silver','gold'];
    const reveal = order.indexOf(phase);
    if (award === 'passed' && reveal >= 1) return { cls: 'passed', label: '★ 1차 통과' };
    if (award === 'special' && reveal >= 2) return { cls: 'special', label: '⭐ 특별상' };
    if (award === 'bronze' && reveal >= 3) return { cls: 'bronze', label: '🥉 3위' };
    if (award === 'silver' && reveal >= 4) return { cls: 'silver', label: '🥈 2위' };
    if (award === 'gold' && reveal >= 5) return { cls: 'gold', label: '🥇 1위' };
    // bronze/silver/gold 인데 아직 그 phase 도달 못한 경우 1차 통과 표시
    if (['bronze','silver','gold'].includes(award) && reveal >= 1) return { cls: 'passed', label: '★ 1차 통과' };
    return null;
  }

  function escape(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  function projectCard(p, phase, opts = {}) {
    const badge = getBadge(p.award, phase);
    const showBadge = !opts.hideBadge && badge;
    return `<div class="project-card" data-project="${p.id}">
      ${showBadge ? `<div class="pc-badge ${badge.cls}">${badge.label}</div>` : ''}
      <div class="pc-title">${escape(p.team)}</div>
      <div class="pc-tagline">${escape(p.tagline)}</div>
      <div class="pc-meta">
        <span class="pc-members">${p.members.map(escape).join(' · ')}</span>
      </div>
      <div class="pc-foot">
        ${p.url ? `<a class="pc-link" href="${escape(p.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 데모</a>` : ''}
        <span class="pc-comment-count">💬 ${(loadComments()[p.id]||[]).length || p.comments || 0}</span>
        <span class="pc-time">${escape(p.registeredAt)}</span>
      </div>
    </div>`;
  }

  function renderAwards(projects, phase) {
    if (phase === 'hidden') return '';
    const order = ['hidden','passed','special','bronze','silver','gold'];
    const reveal = order.indexOf(phase);
    let html = `<div class="section-head" style="margin-bottom:24px;">
      <div>
        <div class="eyebrow"><span class="pip"></span> AWARDS</div>
        <h2 style="font-size:48px;">시상 결과</h2>
      </div>
      <span class="section-tag">▸ 단계별 공개 중</span>
    </div>`;

    // 1위 (gold)
    if (reveal >= 5) {
      const w = projects.find(p => p.award === 'gold');
      if (w) {
        html += `<div class="award-tier award-1">
          <div class="award-tier-head">
            <span class="award-tier-medal">🥇</span> 1위
            <span class="award-tier-meta">CHAMPION</span>
          </div>
          ${projectCard(w, phase)}
        </div>`;
      }
    }
    // 2위 (silver)
    if (reveal >= 4) {
      const w = projects.find(p => p.award === 'silver');
      if (w) {
        html += `<div class="award-tier award-2">
          <div class="award-tier-head">
            <span class="award-tier-medal">🥈</span> 2위
            <span class="award-tier-meta">RUNNER-UP</span>
          </div>
          <div class="project-grid">${projectCard(w, phase)}</div>
        </div>`;
      }
    }
    // 3위 (bronze, 1팀)
    if (reveal >= 3) {
      const ws = projects.filter(p => p.award === 'bronze');
      if (ws.length) {
        html += `<div class="award-tier award-3">
          <div class="award-tier-head">
            <span class="award-tier-medal">🥉</span> 3위
            <span class="award-tier-meta">${ws.length} TEAM${ws.length > 1 ? 'S' : ''}</span>
          </div>
          <div class="project-grid">${ws.map(p => projectCard(p, phase)).join('')}</div>
        </div>`;
      }
    }
    // 특별상 (6팀)
    if (reveal >= 2) {
      const ws = projects.filter(p => p.award === 'special');
      if (ws.length) {
        html += `<div class="award-tier award-special">
          <div class="award-tier-head">
            <span class="award-tier-medal">⭐</span> 특별상
            <span class="award-tier-meta">${ws.length} TEAMS</span>
          </div>
          <div class="project-grid">${ws.map(p => projectCard(p, phase)).join('')}</div>
        </div>`;
      }
    }
    // 1차 통과 띠 — passed/bronze/silver/gold (특별상은 별개 그룹)
    if (reveal >= 1) {
      const passed = projects.filter(p => ['passed','bronze','silver','gold'].includes(p.award));
      if (passed.length) {
        html += `<div class="passed-list" style="margin-top:24px;">
          <span class="label">★ 1차 통과 ${passed.length}팀</span>
          ${passed.map(p => `<span class="passed-tag">${escape(p.team)}</span>`).join('')}
        </div>`;
      }
    }
    return html;
  }

  function render() {
    const projects = loadProjects();
    const phase = getPhase();
    // 신규 등록(id가 'p' + timestamp 형식) → 항상 mock보다 위
    // 같은 그룹끼리는 registeredAt 시간 역순
    const sorted = [...projects].sort((a, b) => {
      const aNew = (a.id || '').length > 5;
      const bNew = (b.id || '').length > 5;
      if (aNew !== bNew) return aNew ? -1 : 1;
      if (aNew) return (b.id || '').localeCompare(a.id || '');
      return (b.registeredAt || '').localeCompare(a.registeredAt || '');
    });

    document.getElementById('projectCount').textContent = projects.length;
    document.getElementById('projectGrid').innerHTML = sorted.map(p => projectCard(p, phase)).join('');

    const awardsEl = document.getElementById('awardsSection');
    if (phase === 'hidden') {
      awardsEl.style.display = 'none';
      awardsEl.innerHTML = '';
    } else {
      awardsEl.style.display = 'block';
      awardsEl.innerHTML = renderAwards(projects, phase);
    }

    // 카드 클릭
    document.querySelectorAll('[data-project]').forEach(el => {
      el.addEventListener('click', () => openDetail(el.dataset.project));
    });
  }

  function tickBoardCountdown() {
    const now = new Date();
    let diff = window.RC.getDeadline() - now;
    const el = document.getElementById('boardCountdown');
    if (!el) return;
    if (diff <= 0) {
      el.textContent = '마감';
      return;
    }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.textContent = `${h}h ${window.RC.pad(m)}m ${window.RC.pad(s)}s`;
  }

  // ============ 상세 모달 ============
  function openDetail(id) {
    const projects = loadProjects();
    const p = projects.find(x => x.id === id);
    if (!p) return;
    const comments = loadComments()[id] || [];
    const d = p.details || {};
    const phase = getPhase();
    const badge = getBadge(p.award, phase);
    const canEdit = !!p._password; // 본인이 등록한 프로젝트만 수정/삭제 가능

    const inner = document.getElementById('detailModalInner');
    inner.innerHTML = `
      <div class="modal-head">
        <div>
          ${badge ? `<div class="pc-badge ${badge.cls}" style="position:static; display:inline-block; margin-bottom:8px;">${badge.label}</div>` : ''}
          <div class="modal-title" style="font-size:36px; word-break:keep-all;">${escape(p.team)}</div>
          <div class="modal-sub">${escape((p.members||[]).join(' · '))} · ${escape(p.registeredAt)}</div>
        </div>
        <button class="modal-close" data-close>✕</button>
      </div>
      <div class="modal-body">
        <div style="background:var(--orange-pale); border:1px dashed var(--orange); padding:14px 18px; border-radius:10px; margin-bottom:20px; font-size:15px; line-height:1.5; white-space:pre-wrap;">
          <strong style="color:var(--orange-deep);">💡 한줄 소개</strong><br>
          ${escape(p.tagline)}
        </div>
        ${p.url ? `<div style="margin-bottom:20px; word-break:break-all;"><a class="pc-link" href="${escape(p.url)}" target="_blank" rel="noopener">🔗 ${escape(p.url)}</a></div>` : ''}

        <div class="field-divider" data-label="ABOUT"></div>

        ${[
          ['Q1. 무슨 문제를 해결하려고 하나요?', d.problem],
          ['Q2. 누구를 위한 서비스인가요?', d.target],
          ['Q3. 기존 방식보다 어떤 점이 나아지나요?', d.better],
          ['Q4. 오늘 반드시 구현할 핵심 기능은?', d.mvp],
          ['Q5. 현재 실제로 동작하는 부분은?', d.progress],
        ].map(([q, a]) => a ? `
          <div style="margin-bottom:18px;">
            <div style="font-weight:700; font-size:14px; color:var(--orange-deep); margin-bottom:6px;">${q}</div>
            <div style="font-size:14.5px; line-height:1.6; color:rgba(14,14,14,0.85); white-space:pre-wrap;">${escape(a)}</div>
          </div>
        ` : '').join('')}

        <div class="field-divider" data-label="COMMENTS"></div>

        <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;">
          ${comments.length ? comments.map(c => `
            <div style="background:var(--paper-2); border-radius:10px; padding:12px 16px;">
              <div style="font-size:13px; font-weight:700; margin-bottom:4px;">${escape(c.name)} · <span style="font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gray); font-weight:600;">${escape(c.time)}</span></div>
              <div style="font-size:14px; line-height:1.5; white-space:pre-wrap;">${escape(c.body)}</div>
            </div>
          `).join('') : '<div style="font-size:13px; color:var(--gray); font-style:italic;">아직 댓글이 없어요. 첫 댓글을 남겨주세요!</div>'}
        </div>

        <div style="display:grid; grid-template-columns:140px 1fr auto; gap:8px;">
          <input class="input" id="commentName" placeholder="이름">
          <input class="input" id="commentBody" placeholder="응원 한마디">
          <button class="btn btn-primary" id="commentSubmit">등록</button>
        </div>
      </div>
      <div class="modal-foot">
        ${canEdit ? `
          <button class="btn btn-sm" data-edit-project="${p.id}">✏️ 수정</button>
          <button class="btn btn-sm" data-delete-project="${p.id}" style="color:var(--red); border-color:var(--red);">🗑 삭제</button>
        ` : `
          <span style="font-size:12px; color:var(--gray);">※ 수정·삭제는 본인 등록 프로젝트만 가능합니다</span>
        `}
        <button class="btn" data-close style="margin-left:auto;">닫기</button>
      </div>
    `;
    document.getElementById('detailModal').classList.add('open');
    bindCloseButtons();

    document.getElementById('commentSubmit').addEventListener('click', () => {
      const name = document.getElementById('commentName').value.trim();
      const body = document.getElementById('commentBody').value.trim();
      if (!name || !body) { alert('이름과 내용을 입력해주세요'); return; }
      const all = loadComments();
      const arr = all[id] || [];
      const now = new Date();
      arr.push({ name, body, time: `${window.RC.pad(now.getHours())}:${window.RC.pad(now.getMinutes())}` });
      all[id] = arr;
      saveComments(all);
      openDetail(id); // 재렌더
    });

    // 수정 / 삭제 (본인 프로젝트만)
    if (canEdit) {
      inner.querySelector('[data-edit-project]').addEventListener('click', () => {
        const pw = prompt('수정용 비밀번호를 입력해주세요:');
        if (pw === null) return;
        if (pw !== p._password) {
          alert('비밀번호가 일치하지 않습니다.\n분실 시 운영팀에 문의해주세요.');
          return;
        }
        openEditForm(p);
      });
      inner.querySelector('[data-delete-project]').addEventListener('click', () => {
        const pw = prompt('삭제하려면 비밀번호를 입력해주세요:');
        if (pw === null) return;
        if (pw !== p._password) {
          alert('비밀번호가 일치하지 않습니다.\n분실 시 운영팀에 문의해주세요.');
          return;
        }
        if (!confirm(`정말 "${p.team}" 프로젝트를 삭제할까요? 되돌릴 수 없습니다.`)) return;
        saveProjects(loadProjects().filter(x => x.id !== p.id));
        document.getElementById('detailModal').classList.remove('open');
        render();
      });
    }
  }

  function bindCloseButtons() {
    document.querySelectorAll('[data-close]').forEach(b => {
      b.onclick = () => document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
    });
  }

  // ============ 등록 / 수정 ============
  let editingId = null;

  function resetNewForm() {
    editingId = null;
    document.getElementById('newProjectForm').reset();
    document.querySelector('#newProjectModal .modal-title').textContent = '프로젝트 등록';
    document.querySelector('#newProjectModal .modal-sub').textContent = 'REGISTER NEW PROJECT';
    document.getElementById('submitNewProject').textContent = '등록하기';
  }

  function openEditForm(p) {
    editingId = p.id;
    const form = document.getElementById('newProjectForm');
    const memberNames = (p.members || []).slice(0, 2);
    form.team.value = p.team || '';
    form.member1Name.value = memberNames[0] || '';
    form.member2Name.value = memberNames[1] || '';
    form.password.value = p._password || '';
    form.url.value = p.url || '';
    form.tagline.value = p.tagline || '';
    form.problem.value = p.details?.problem || '';
    form.target.value = p.details?.target || '';
    form.better.value = p.details?.better || '';
    form.mvp.value = p.details?.mvp || '';
    form.progress.value = p.details?.progress || '';

    document.querySelector('#newProjectModal .modal-title').textContent = '프로젝트 수정';
    document.querySelector('#newProjectModal .modal-sub').textContent = 'EDIT PROJECT';
    document.getElementById('submitNewProject').textContent = '저장';
    document.getElementById('detailModal').classList.remove('open');
    document.getElementById('newProjectModal').classList.add('open');
  }

  document.getElementById('newProjectBtn').addEventListener('click', () => {
    resetNewForm();
    document.getElementById('newProjectModal').classList.add('open');
  });
  bindCloseButtons();

  document.getElementById('submitNewProject').addEventListener('click', () => {
    const form = document.getElementById('newProjectForm');
    if (!form.reportValidity()) return;
    const fd = new FormData(form);
    const memberNames = [fd.get('member1Name')];
    if (fd.get('member2Name')) memberNames.push(fd.get('member2Name'));
    const now = new Date();
    const projects = loadProjects();

    if (editingId) {
      // 수정 모드
      const idx = projects.findIndex(p => p.id === editingId);
      if (idx >= 0) {
        const { _privateMembers: _legacy, ...prev } = projects[idx];
        projects[idx] = {
          ...prev,
          team: fd.get('team'),
          tagline: fd.get('tagline'),
          members: memberNames,
          _password: fd.get('password'),
          url: fd.get('url'),
          details: {
            problem: fd.get('problem'),
            target: fd.get('target'),
            better: fd.get('better'),
            mvp: fd.get('mvp'),
            progress: fd.get('progress'),
          },
        };
        saveProjects(projects);
        resetNewForm();
        document.getElementById('newProjectModal').classList.remove('open');
        render();
        alert('수정 완료!');
      }
      return;
    }

    // 신규 등록
    const newP = {
      id: 'p' + Date.now(),
      team: fd.get('team'),
      tagline: fd.get('tagline'),
      members: memberNames,
      _password: fd.get('password'),
      url: fd.get('url'),
      registeredAt: `${window.RC.pad(now.getHours())}:${window.RC.pad(now.getMinutes())}`,
      comments: 0,
      award: null,
      details: {
        problem: fd.get('problem'),
        target: fd.get('target'),
        better: fd.get('better'),
        mvp: fd.get('mvp'),
        progress: fd.get('progress'),
      },
    };
    projects.push(newP);
    saveProjects(projects);
    resetNewForm();
    document.getElementById('newProjectModal').classList.remove('open');
    render();
    alert('등록 완료! 보드 상단에서 확인하세요.');
  });

  // overlay 클릭 시 닫기 — 상세 모달만 (등록 모달은 작성 중 실수 방지)
  document.getElementById('detailModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });

  // 첫 렌더
  render();
  tickBoardCountdown();
  setInterval(tickBoardCountdown, 1000);
  // 다른 디바이스(어드민/다른 참가자) 변경분을 5초 ETag 폴링으로 반영
  RCSync.on(STORE_KEY, render);
  RCSync.on(AWARD_KEY, render);
  RCSync.on(COMMENTS_KEY, render);
  RCSync.start([STORE_KEY, AWARD_KEY, COMMENTS_KEY]);
})();
</script>

</body>
</html>
